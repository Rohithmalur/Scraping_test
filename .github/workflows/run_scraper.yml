name: Free Maersk Cloud Scraper

on:
  workflow_dispatch: # Allows you to manually trigger via the button
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight UTC

jobs:
  scrape:
    # Explicitly lock to 24.04 to prevent breaking changes during the 26.04 migration
    runs-on: ubuntu-24.04 
    steps:
      - name: Copy Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome Browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python Dependencies
        run: |
          pip install pymupdf pandas undetected-chromedriver selenium

      - name: Execute Scraper Script
        env:
          # Expose the installed Chrome binary path directly to your Python script
          CHROME_BIN_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scraper.py
