name: Free Maersk Cloud Scraper

on:
  workflow_dispatch: # Gives you a "Run" button on GitHub to start it manually
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python Dependencies
        run: |
          pip install pymupdf pandas undetected-chromedriver selenium

      - name: Execute Scraper Script
        run: python scraper.py